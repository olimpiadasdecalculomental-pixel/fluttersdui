name: Compilar APK Gratis SuperApp Flutter (Esquema 3)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-apk-flutter:
    runs-on: ubuntu-latest
    steps:
      - name: 1. Descargar repositorio
        uses: actions/checkout@v4

      - name: 2. Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 3. Instalar Flutter 3.24.5 LTS Estable
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'
          cache: true

      - name: 4. Generar estructura nativa limpia Android/iOS e inyectar permisos SuperApp
        run: |
          cp pubspec.yaml /tmp/pubspec.yaml
          cp lib/main.dart /tmp/main.dart
          rm -rf android ios test analysis_options.yaml
          flutter create --platforms=android,ios --org com.orbe.sanjose --project-name motor_universal_flutter .
          rm -rf test analysis_options.yaml
          cp /tmp/pubspec.yaml pubspec.yaml
          cp /tmp/main.dart lib/main.dart
          echo "" | base64 -d | python3

      - name: 5. Descargar dependencias y verificar codigo Dart
        run: |
          flutter pub get
          flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: 6. Compilar APK Release Universal (Celular y Tablet)
        run: flutter build apk --release --no-tree-shake-icons

      - name: 7. Publicar APK descargable en GitHub Actions
        uses: actions/upload-artifact@v4
        with:
          name: APK-SuperApp-Orbe-Flutter-Esquema3
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30