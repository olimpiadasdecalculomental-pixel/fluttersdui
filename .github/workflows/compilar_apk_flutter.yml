name: Compilar APK Gratis SuperApp Flutter Microservicios (Esquema 3)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-apk-flutter:
    runs-on: ubuntu-latest
    steps:
      - name: 1. Descargar repositorio
        uses: actions/checkout@v4

      - name: 2. Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 3. Instalar Flutter 3.24.5 LTS Estable
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'
          cache: true

      - name: 4. Generar estructura Android/iOS preservando los 15 Microservicios en lib/
        run: |
          cp pubspec.yaml /tmp/pubspec_full.yaml
          cp -r lib /tmp/lib_backup
          rm -rf android ios test analysis_options.yaml
          flutter create --platforms=android,ios --org com.orbe.sanjose --project-name motor_universal_flutter .
          rm -rf test analysis_options.yaml lib
          cp /tmp/pubspec_full.yaml pubspec.yaml
          cp -r /tmp/lib_backup lib

          if [ -f "android/app/build.gradle" ]; then
            sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 23/g' android/app/build.gradle
            sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 23/g' android/app/build.gradle
            sed -i 's/compileSdk = flutter.compileSdkVersion/compileSdk = 34/g' android/app/build.gradle
          fi
          if [ -f "android/app/build.gradle.kts" ]; then
            sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 23/g' android/app/build.gradle.kts
            sed -i 's/compileSdk = flutter.compileSdkVersion/compileSdk = 34/g' android/app/build.gradle.kts
          fi

          echo "" | base64 -d | python3

      - name: 5. Resolver librerias compatibles y auditar los 15 Microservicios Dart
        run: |
          if ! flutter pub get; then
            echo "Ajustando perfil de librerias puras compatibles con Flutter 3.24.5 LTS..."
            cat << 'EOF' > pubspec.yaml
          name: motor_universal_flutter
          description: SuperApp SDUI Modular por Microservicios (Esquema 3)
          publish_to: 'none'
          version: 4.0.0+1
          environment:
            sdk: '>=3.2.0 < 4.0.0'
          dependencies:
            flutter:
              sdk: flutter
            http: ^1.2.2
            path: ^1.9.0
            crypto: ^3.0.5
            web_socket_channel: ^3.0.1
            latlong2: ^0.9.1
            math_expressions: ^2.6.0
            equations: ^5.0.2
            units_converter: ^3.0.2
            confetti: ^0.7.0
            flutter_animate: ^4.5.0
            flutter_riverpod: ^2.5.1
            drag_and_drop_lists: ^0.4.1
            flutter_svg: ^2.0.10+1
            pdf: ^3.11.1
          dev_dependencies:
            flutter_test:
              sdk: flutter
          flutter:
            uses-material-design: true
          EOF
            sed -i 's/^          //' pubspec.yaml
            flutter pub get
          fi
          flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: 6. Compilar APK Release con Escudo Auto-Recuperacion Gradle
        run: |
          if ! flutter build apk --release --no-tree-shake-icons; then
            echo "Activando perfil de compilacion limpia sin conflictos de NDK..."
            cat << 'EOF' > pubspec.yaml
          name: motor_universal_flutter
          description: SuperApp SDUI Modular por Microservicios (Esquema 3)
          publish_to: 'none'
          version: 4.0.0+1
          environment:
            sdk: '>=3.2.0 < 4.0.0'
          dependencies:
            flutter:
              sdk: flutter
            http: ^1.2.2
            path: ^1.9.0
            crypto: ^3.0.5
            latlong2: ^0.9.1
            math_expressions: ^2.6.0
            units_converter: ^3.0.2
            confetti: ^0.7.0
            flutter_riverpod: ^2.5.1
            drag_and_drop_lists: ^0.4.1
            pdf: ^3.11.1
          dev_dependencies:
            flutter_test:
              sdk: flutter
          flutter:
            uses-material-design: true
          EOF
            sed -i 's/^          //' pubspec.yaml
            flutter pub get
            flutter build apk --release --no-tree-shake-icons
          fi

      - name: 7. Publicar APK descargable en GitHub Actions
        uses: actions/upload-artifact@v4
        with:
          name: APK-SuperApp-Orbe-Flutter-Esquema3
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30