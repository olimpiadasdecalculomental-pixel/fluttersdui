name: Compilar APK Gratis SuperApp Flutter (Esquema 3)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-apk-flutter:
    runs-on: ubuntu-latest
    steps:
      - name: 1. Descargar repositorio
        uses: actions/checkout@v4

      - name: 2. Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 3. Instalar Flutter 3.24.5 LTS Estable (Compatible Android, iOS y Tablets)
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'
          cache: true

      - name: 4. Generar estructura nativa limpia Android/iOS e inyectar permisos
        run: |
          mv pubspec.yaml /tmp/pubspec.yaml
          mv lib/main.dart /tmp/main.dart
          rm -rf android ios test
          flutter create --platforms=android,ios --org com.orbe.sanjose --project-name motor_universal_flutter .
          rm -rf test
          mv /tmp/pubspec.yaml pubspec.yaml
          mv /tmp/main.dart lib/main.dart

          sed -i '/<application/i \
          <uses-permission android:name="android.permission.INTERNET"/>\n\
          <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>\n\
          <uses-permission android:name="android.permission.VIBRATE"/>' android/app/src/main/AndroidManifest.xml

      - name: 5. Descargar dependencias y verificar codigo Dart
        run: |
          flutter pub get
          flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: 6. Compilar APK Release Universal (Celular y Tablet)
        run: flutter build apk --release --no-tree-shake-icons -v

      - name: 7. Publicar APK descargable en GitHub Actions
        uses: actions/upload-artifact@v4
        with:
          name: APK-SuperApp-Orbe-Flutter-Esquema3
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30