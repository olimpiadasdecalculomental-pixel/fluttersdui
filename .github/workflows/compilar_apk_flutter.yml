name: Compilar APK Gratis SuperApp Flutter 3.50 (Esquema 3 + 3 Motores SDUI + Logo)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-apk-flutter:
    runs-on: ubuntu-latest
    steps:
      - name: 1. Descargar repositorio
        uses: actions/checkout@v4

      - name: 2. Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 3. Instalar Flutter 3.50 Estable
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: 4. Generar estructura Android/iOS preservando lib/ y logo.png
        run: |
          mv pubspec.yaml /tmp/pubspec_full.yaml
          cp -r lib /tmp/lib_backup
          if [ -f "logo.png" ]; then cp logo.png /tmp/logo_backup.png; fi
          rm -rf android ios test analysis_options.yaml
          flutter create --no-pub --platforms=android,ios --org com.orbe.sanjose --project-name motor_universal_flutter .
          rm -rf test analysis_options.yaml lib
          mv /tmp/pubspec_full.yaml pubspec.yaml
          cp -r /tmp/lib_backup lib
          if [ -f "/tmp/logo_backup.png" ]; then cp /tmp/logo_backup.png logo.png; fi
          python3 configurar_build.py android

      - name: 5. Resolver las 56 librerias en Flutter 3.50 y verificar los Microservicios Dart
        run: |
          python3 configurar_build.py pub
          flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: 6. Compilar APK Release en Flutter 3.50 con Escudo Auto-Recuperacion
        run: |
          python3 configurar_build.py apk

      - name: 7. Publicar APK descargable en GitHub Actions
        uses: actions/upload-artifact@v4
        with:
          name: APK-SuperApp-Orbe-Flutter350-Esquema3
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30