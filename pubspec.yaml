name: motor_universal_flutter
description: SuperApp SDUI Modular por Microservicios (Esquema 3 - Flutter 3.50 Full + 3 Motores SDUI)
publish_to: 'none'
version: 5.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter

  # 1. Los 3 Motores SDUI (Propio + Stac #15 + JsonDynamicWidget #16), Backend y Cache Offline
  stac: ^0.7.0                   # Motor #15 SDUI (antes mirai) para disenos puros de Google Stitch
  json_dynamic_widget: ^7.0.6    # Motor #16 SDUI Hibrido compatible con equations
  hive_ce: ^2.6.0                # Cache ultrarrapido para pantallas JSON offline
  http: ^1.2.2
  shared_preferences: ^2.3.3
  path: ^1.9.0
  path_provider: ^2.1.5
  sqflite: ^2.4.0
  cached_network_image: ^3.4.1
  flutter_riverpod: ^2.6.1

  # 2. Arrastrar y Soltar (Drag & Drop)
  drag_and_drop_lists: ^0.4.2

  # 3. Chat WeChat, Notas de Voz, Llamadas P2P y Voz Parlante
  flutter_chat_ui: ^1.6.15       # Burbujas y estados de lectura estilo WeChat
  flutter_webrtc: ^0.12.1        # Llamadas y videollamadas P2P
  record: ^5.1.2                 # Grabar notas de voz
  just_audio: ^0.9.42            # Audio de baja latencia
  flutter_tts: ^4.1.0            # Voz que habla el recordatorio
  audioplayers: ^6.1.0
  share_plus: ^10.1.2

  # 4. Finanzas, Cripto Binance, WebSockets y Biometria
  fl_chart: ^0.69.0              # Graficos de velas japonesas y votaciones
  web_socket_channel: ^3.0.1
  crypto: ^3.0.6
  flutter_secure_storage: ^9.2.2
  local_auth: ^2.3.0

  # 5. Educacion, Visor PDF, Escaner QR y Multimedia
  mobile_scanner: ^6.0.2         # Escaner rapido de QR y pagos
  pdfrx: ^1.0.92                 # Lector de libros PDF de alto rendimiento
  video_player: ^2.9.2
  chewie: ^1.8.5
  webview_flutter: ^4.10.0       # Soporta WebAR HTML5
  pdf: ^3.11.1
  printing: ^5.13.4
  image_picker: ^1.1.2

  # 6. Juegos 2D, Fisica Box2D, Modelos 3D y Video VR 360
  flame: ^1.21.0
  forge2d: ^0.13.1
  model_viewer_plus: ^1.8.1      # Modelos 3D interactivos (.glb / .gltf)
  video_360: ^0.0.8              # Cine y turismo inmersivo VR 360
  confetti: ^0.8.0
  flutter_animate: ^4.5.0

  # 7. Hardware, IoT Arduino, Bluetooth BLE, WiFi, GPS y 4DX
  mqtt_client: ^10.5.1           # Telemetria IoT y salas 4DX
  flutter_blue_plus: ^1.34.5     # Bluetooth BLE para placas Arduino/ESP32
  wifi_iot: ^0.3.19              # Conexion directa a redes WiFi de sensores
  vibration: ^2.0.1              # Vibracion haptica sincronizada 4DX
  geolocator: ^13.0.1
  flutter_map: ^7.0.2            # Mapa visual OpenStreetMap (junto a latlong2)
  latlong2: ^0.9.1
  sensors_plus: ^6.1.0
  connectivity_plus: ^6.1.0

  # 8 y 9. Matematicas, Calculo, Fisica y Quimica
  flutter_math_fork: ^0.7.3      # Formulas matematicas y quimicas en LaTeX
  math_expressions: ^2.6.0
  equations: ^5.0.2
  units_converter: ^3.0.2

  # 10. Dibujo, Pizarra Tactil y Vectorial SVG
  flutter_drawing_board: ^0.9.5  # Pizarra educativa y firmas
  flutter_svg: ^2.0.14
  url_launcher: ^6.3.1

  # 11. EXTRA: Inteligencia Artificial + Alarma Hablada en el Bolsillo
  google_generative_ai: ^0.4.6   # Cerebro de IA Gemini directo en la app
  flutter_local_notifications: ^18.0.1
  timezone: ^0.9.4

# Unificador de sub-dependencias para que json_dynamic_widget, stac y equations no choquen
dependency_overrides:
  petitparser: ^6.0.2
  intl: ^0.19.0
  meta: ^1.15.0
  collection: ^1.18.0
  http: ^1.2.2
  web: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - logo.png