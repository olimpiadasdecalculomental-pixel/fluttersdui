name: motor_universal_flutter
description: SuperApp SDUI Modular por Microservicios (Esquema 3 - 10 Categorias de Librerias)
publish_to: 'none'
version: 4.0.0+1

environment:
  sdk: '>=3.2.0 < 4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # 1. Motores SDUI, Backend, Estado y Cache Offline (Categoria 1)
  http: ^1.2.2
  shared_preferences: ^2.3.2
  path: ^1.9.0
  path_provider: ^2.1.4
  sqflite: ^2.3.3+1
  cached_network_image: ^3.4.0
  flutter_riverpod: ^2.5.1

  # 2. Arrastrar y Soltar - Drag & Drop (Categoria 2)
  drag_and_drop_lists: ^0.4.1

  # 3. Chat, Audio, Voz Duolingo y Red Social WeChat (Categoria 3)
  flutter_tts: ^4.0.2
  audioplayers: ^6.1.0
  share_plus: ^10.0.2

  # 4. Finanzas, Cripto, WebSockets y Seguridad Biometrica (Categoria 4)
  web_socket_channel: ^3.0.1
  crypto: ^3.0.5
  flutter_secure_storage: ^9.2.2
  local_auth: ^2.3.0

  # 5. Educacion, Libros PDF y Multimedia Udemy (Categoria 5)
  video_player: ^2.9.1
  chewie: ^1.8.3
  webview_flutter: ^4.8.0
  pdf: ^3.11.1
  printing: ^5.13.2
  image_picker: ^1.1.2

  # 6. Juegos 2D Flame, Fisica Box2D y Animaciones Kahoot/Lumosity (Categoria 6)
  flame: ^1.18.0
  forge2d: ^0.13.1
  confetti: ^0.7.0
  flutter_animate: ^4.5.0

  # 7. Hardware, IoT MQTT, Bluetooth BLE, Sensores y GPS (Categoria 7)
  mqtt_client: ^10.5.1
  flutter_blue_plus: ^1.32.12
  connectivity_plus: ^6.0.5
  geolocator: ^12.0.0
  sensors_plus: ^6.0.1
  latlong2: ^0.9.1

  # 8 y 9. Matematicas, Calculo, Fisica y Quimica (Categorias 8 y 9)
  math_expressions: ^2.6.0
  equations: ^5.0.2
  units_converter: ^3.0.2

  # 10. Dibujo Vectorial SVG y Enlaces (Categoria 10)
  flutter_svg: ^2.0.10+1
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true